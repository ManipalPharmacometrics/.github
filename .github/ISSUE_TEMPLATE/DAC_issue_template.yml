name: "DAC issue template"
description: "Log your upcoming DAC meeting."
title: "Your Name – DAC"
projects: ["ManipalPharmacometrics/11"]
body:
  - type: markdown
    attributes:
      value: |
        ### After clicking Create, set **Event Date** on the right (Projects → DAC Meeting Dates). This is what puts your meeting on the calendar.

  - type: textarea
    id: done
    attributes:
      label: What's done till now
    validations:
      required: true

  - type: textarea
    id: plan
    attributes:
      label: Plan for the meeting
    validations:
      required: true

  - type: textarea
    id: suggestions
    attributes:
      label: Suggestions from the meeting
      description: "Fill this in after the meeting. Add one per line as - [ ] suggestion, so they can be ticked off."
    validations:
      required: false
