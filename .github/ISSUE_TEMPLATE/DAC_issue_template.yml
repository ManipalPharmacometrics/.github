name: "Meeting template"
description: "Log an upcoming meeting."
title: "Your Name – Meeting"
body:
  - type: markdown
    attributes:
      value: |
        **Before you submit:** replace *Your Name* in the title above (e.g. `Sai Ahil – Meeting`).

        **After creating the issue:** add it to the relevant project in the right sidebar and set the **Target date** (the planned meeting date).

        **After the meeting:** click **⋯ → Edit** on this issue, add the suggestions under *Suggestions from the meeting*, then close the issue. Closed issues stay in the **Closed** tab for reference.

  - type: textarea
    id: done
    attributes:
      label: What's done till now
      description: "One item per line."
      value: |
        -
    validations:
      required: true

  - type: textarea
    id: plan
    attributes:
      label: Plan for the meeting
      description: "What you will present or discuss. One item per line."
      value: |
        -
    validations:
      required: true

  - type: input
    id: presentation
    attributes:
      label: Link to final presentation
      description: "Add the link (Drive, OneDrive, etc.) once the slides are ready."
      placeholder: "https://"
    validations:
      required: false

  - type: textarea
    id: suggestions
    attributes:
      label: Suggestions from the meeting
      description: "Leave blank for now. After the meeting, edit the issue and add one suggestion per line so they can be ticked off."
      value: |
        - [ ]
    validations:
      required: false
