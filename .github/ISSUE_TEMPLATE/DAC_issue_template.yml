name: "DAC issue template"
description: "Log your upcoming DAC meeting."
title: "Your Name – DAC"
projects: ["ManipalPharmacometrics/11"]
body:
  - type: markdown
    attributes:
      value: |
        After creating the issue, set **Event Date** in the right sidebar (Projects → DAC Meeting Dates) so it shows on the roadmap.

  - type: textarea
    id: done
    attributes:
      label: What's done till now
    validations:
      required: true

  - type: textarea
    id: plan
    attributes:
      label: Plan for the meeting
    validations:
      required: true

  - type: input
    id: presentation
    attributes:
      label: Link to final presentation
      description: "Add the link (Drive, OneDrive, etc.) once the slides are ready."
      placeholder: "https://"
    validations:
      required: false

  - type: textarea
    id: suggestions
    attributes:
      label: Suggestions from the meeting
      description: "Fill this in after the meeting, one per line, so they can be ticked off."
    validations:
      required: false
